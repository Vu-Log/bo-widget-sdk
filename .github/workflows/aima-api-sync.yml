name: aima-api sync

# Regenerates the aima-api skill (plugins/bo-widget/skills/aima-api) from the public AIMA swagger
# and opens (or updates) a pull request when the regenerated files differ from main.
# Pull requests opened with the default token do not trigger CI, which main requires: set the
# RELEASE_GITHUB_TOKEN secret (fine-grained token with contents and pull-requests write) so that
# the push and the pull request are made with it. Without it, the default token is used and
# "Allow GitHub Actions to create and approve pull requests" must be enabled.
on:
  schedule:
    - cron: '0 6 * * 1' # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aima-api-sync
  cancel-in-progress: false

env:
  BRANCH: chore/aima-api-sync
  SKILL_DIR: plugins/bo-widget/skills/aima-api
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  sync:
    name: Regenerate the aima-api skill
    # The PR targets main and the diff is taken against the checkout: run on main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the release GitHub token
        run: |
          if [ -z "$RELEASE_GITHUB_TOKEN" ]; then
            echo "::warning::RELEASE_GITHUB_TOKEN is not set: the sync pull request will not trigger CI"
          fi
        env:
          RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No token left in .git/config while npm ci and the checks run: the push step passes its own.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Regenerate the skill
        run: npm run -s aima-api:generate -- --summary "$RUNNER_TEMP/aima-api-summary.json"

      - name: Detect changes
        id: diff
        run: |
          # --porcelain also lists new (untracked) generated files, unlike `git diff --quiet`.
          if [ -z "$(git status --porcelain -- "$SKILL_DIR")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The sync PR must never shrink the skill silently: compare with the count of main.
      - name: Compare the endpoint count with main
        if: steps.diff.outputs.changed == 'true'
        id: count
        run: |
          set -euo pipefail
          # Same line as ENDPOINT_COUNT_LINE in scripts/skills.test.mjs.
          count_of() { grep -m 1 -oE '[0-9]+ endpoints a widget can call' | grep -oE '^[0-9]+'; }
          AFTER=$(count_of < "$SKILL_DIR/SKILL.md") || AFTER=""
          if [ -z "$AFTER" ]; then
            echo "::error::Endpoint count not found in the regenerated $SKILL_DIR/SKILL.md"
            exit 1
          fi
          BEFORE=""
          if git cat-file -e "origin/main:$SKILL_DIR/SKILL.md" 2>/dev/null; then
            # Through a file, not a pipe: grep -m 1 could close it early (SIGPIPE under pipefail).
            git show "origin/main:$SKILL_DIR/SKILL.md" > "$RUNNER_TEMP/main-skill.md"
            BEFORE=$(count_of < "$RUNNER_TEMP/main-skill.md") || BEFORE=""
            if [ -z "$BEFORE" ]; then
              echo "::error::Endpoint count not found in $SKILL_DIR/SKILL.md of main"
              exit 1
            fi
          fi
          echo "before=${BEFORE:-none}" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"
          echo "Endpoints: ${BEFORE:-none} -> $AFTER"
          # More than 10 % fewer endpoints: a broken swagger or scope rule, not a sync to propose.
          if [ -n "$BEFORE" ] && [ $((AFTER * 10)) -lt $((BEFORE * 9)) ]; then
            echo "::error::The endpoint count drops by more than 10 % ($BEFORE -> $AFTER): check the swagger and scripts/aima-api/config.mjs. No pull request opened."
            exit 1
          fi

      # Blocking: the skill is published in a public repository, nothing private may be pushed.
      - name: Check the regenerated skill for leaks
        if: steps.diff.outputs.changed == 'true'
        run: npx vitest run --project scripts scripts/skills.test.mjs

      # Report the result in the PR body, and fail the run at the end when a check fails.
      - name: Check the regenerated skill
        if: steps.diff.outputs.changed == 'true'
        id: checks
        continue-on-error: true
        run: |
          status=0
          npm test || status=1
          npm run lint || status=1
          npm run format:check || status=1
          exit "$status"

      # checkout (fetch-depth: 0) already fetched every branch: origin/$BRANCH is the remote state.
      - name: Refuse to overwrite commits not made by this workflow on the sync branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" > /dev/null; then
            # Author AND committer: an amend or a rebase by a person keeps the bot as author.
            AUTHORS=$(git log --format='%ae %ce' "origin/main..refs/remotes/origin/$BRANCH")
            TOTAL=$(printf '%s' "$AUTHORS" | grep -c . || true)
            BOT=$(printf '%s' "$AUTHORS" | grep -cxF "$BOT_EMAIL $BOT_EMAIL" || true)
            if ! [[ "$TOTAL" =~ ^[0-9]+$ && "$BOT" =~ ^[0-9]+$ ]]; then
              echo "::error::Could not count the authors of $BRANCH."
              exit 1
            fi
            OTHERS=$((TOTAL - BOT))
            if [ "$OTHERS" -ne 0 ]; then
              echo "::error::$BRANCH has $OTHERS commit(s) not made by this workflow: merge or close its PR first (a merge of main or an amend counts too; deleting the branch unblocks the sync)."
              exit 1
            fi
          fi

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          # Pushed and opened with this token, so that the pull request triggers CI.
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          CHECKS_OUTCOME: ${{ steps.checks.outcome }}
          COUNT_BEFORE: ${{ steps.count.outputs.before }}
          COUNT_AFTER: ${{ steps.count.outputs.after }}
        run: |
          set -euo pipefail
          SUMMARY="$RUNNER_TEMP/aima-api-summary.json"
          RELEASE=$(SUMMARY="$SUMMARY" node -p 'require(process.env.SUMMARY).stats.release')
          {
            echo "Automatic regeneration of the \`aima-api\` skill from the public AIMA swagger https://vulog-doc-api.web.app/swagger/sta.yaml (release $RELEASE)."
            echo
            echo "Endpoints a widget can call: $COUNT_BEFORE → $COUNT_AFTER."
            echo
            if [ "$CHECKS_OUTCOME" = "success" ]; then
              echo "Tests, lint and format: passed."
            else
              echo "**Tests, lint or format: FAILED** -- see the run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            fi
            echo
            SUMMARY="$SUMMARY" node -e '
              const s = require(process.env.SUMMARY);
              // Warnings quote swagger text: code-format them so Markdown or @mentions are not rendered.
              const code = (x) => "`" + String(x).replace(/`/g, "\x27") + "`";
              const list = (items) => (items.length ? items.map((x) => "- " + code(x)).join("\n") : "None.");
              const MAX = 200;
              const warnings = s.warnings.slice(0, MAX);
              console.log("Endpoints: " + s.stats.endpointCount + " (" + s.stats.excludedCount + " left out), schemas: " + s.stats.schemaCount + ".\n");
              console.log("### Left out, by reason\n" + Object.entries(s.stats.excluded).map(([reason, count]) => "- " + code(reason) + ": " + count).join("\n") + "\n");
              console.log("### Removed generated files\n" + list(s.removed) + "\n");
              console.log("### Generator warnings (" + s.warnings.length + ")\n" + list(warnings));
              if (s.warnings.length > MAX) console.log("\n…and " + (s.warnings.length - MAX) + " more (see the run log).");
            '
            echo
            echo "Unmapped tags go to \`admin-other.md\`: map them in \`scripts/aima-api/config.mjs\`."
          } > "$RUNNER_TEMP/pr-body.md"

          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          # Empty lease when the branch does not exist yet: the push then requires it to be absent.
          LEASE=$(git rev-parse --verify --quiet "refs/remotes/origin/$BRANCH" || true)
          git checkout -B "$BRANCH"
          git add "$SKILL_DIR"
          git commit -m "chore(aima-api): regenerate skill from swagger release $RELEASE"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push --force-with-lease="$BRANCH:$LEASE" origin "$BRANCH"

          PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number // empty')
          TITLE="chore(aima-api): sync with swagger release $RELEASE"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          fi

      - name: Fail the run when a check failed
        if: steps.diff.outputs.changed == 'true' && steps.checks.outcome == 'failure'
        run: |
          echo "::error::Tests, lint or format failed on the regenerated aima-api skill (the PR was opened with the failure noted)."
          exit 1
